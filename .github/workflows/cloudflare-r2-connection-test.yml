name: Cloudflare R2 connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Worker and private R2 bucket
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

          headers=(
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )

          list_response="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://uma-ai-api.w89pgwrjms.workers.dev/r2-check")"

          echo "R2 list check:"
          echo "$list_response" | jq .

          echo "$list_response" | jq -e '
            .status == "ok"
            and .r2 == "connected"
            and (.files | index("_system/connection-test.json") != null)
          ' > /dev/null

          rw_response="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://uma-ai-api.w89pgwrjms.workers.dev/r2-test")"

          echo "R2 write/read check:"
          echo "$rw_response" | jq .

          echo "$rw_response" | jq -e '
            .status == "ok"
            and .write == "success"
            and .read == "success"
            and .savedData.test == "success"
          ' > /dev/null

          echo "Cloudflare Access, Worker, and private R2 list/write/read: OK"
