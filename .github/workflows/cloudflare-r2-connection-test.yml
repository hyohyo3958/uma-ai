name: Cloudflare R2 connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Worker and private R2 bucket
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

          headers=(
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )

          base="https://uma-ai-api.w89pgwrjms.workers.dev"

          health="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$base/health")"
          echo "Worker health check:"
          echo "$health" | jq .
          echo "$health" | jq -e '.status == "ok" and .worker == "uma-ai-api"' > /dev/null

          payload='{"test":"success","message":"UMA AI production API test"}'

          write_response="$(curl --fail-with-body --silent --show-error \
            "${headers[@]}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data-binary "$payload" \
            "$base/data?key=data/connection-test.json")"

          echo "R2 POST write check:"
          echo "$write_response" | jq .
          echo "$write_response" | jq -e '
            .status == "ok"
            and .saved == true
            and .key == "data/connection-test.json"
          ' > /dev/null

          read_response="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
            "$base/data?key=data/connection-test.json")"

          echo "R2 GET read check:"
          echo "$read_response" | jq .
          echo "$read_response" | jq -e '
            .test == "success"
            and .message == "UMA AI production API test"
          ' > /dev/null

          list_response="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$base/files")"

          echo "R2 file list check:"
          echo "$list_response" | jq .
          echo "$list_response" | jq -e '
            .status == "ok"
            and (.files | map(.key) | index("data/connection-test.json") != null)
          ' > /dev/null

          echo "Cloudflare Access, Worker, and production R2 GET/POST/list: OK"
