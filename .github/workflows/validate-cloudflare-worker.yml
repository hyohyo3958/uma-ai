name: Validate Cloudflare Worker

on:
  pull_request:
    branches: [main]
    paths:
      - "wrangler.jsonc"
      - "src/**"
      - "index.html"
      - ".assetsignore"
      - ".github/workflows/validate-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker JavaScript syntax
        run: node --check src/index.js

      - name: Validate Wrangler config and dry-run asset build
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run

      - name: Confirm required app source files exist
        run: |
          test -f index.html
          test -f value-model.js
          test -f history-store.js
          echo "Required app source files are present."
