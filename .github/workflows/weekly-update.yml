name: UMA AI weekly update

on:
  # Automatic runs are paused until a free data source explicitly permits reuse.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uma-ai-weekly-update
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write pipeline status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              "app": "UMA AI",
              "pipeline": "free-and-permission-safe",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "status": "waiting_for_verified_free_data_source",
              "message": "Scheduled status check completed. Automatic race-data collection is paused until the source explicitly permits automated retrieval and reuse. No entries, odds, or predictions are currently available.",
              "race_count": 0,
              "predictions_available": False,
              "data_source": None
          }
          Path("data").mkdir(exist_ok=True)
          Path("data/status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update UMA AI safe pipeline status"
            git push
          fi
